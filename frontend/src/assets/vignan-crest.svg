<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <!-- Outer Shield Outline with concave top curve and pointed top corners -->
  <path d="M14 24 C35 32 85 32 106 24 C107 48 98 84 60 106 C22 84 13 48 14 24 Z" 
        fill="#FFFFFF" 
        stroke="#7A70D6" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Inner Lavender / Purple Circular Disk -->
  <circle cx="60" cy="62" r="32" fill="#B4B0ED"/>

  <!-- 5 Radiating Blue Spokes / Arms aligned with star -->
  <g stroke="#0072CE" stroke-width="8" stroke-linecap="butt">
    <!-- Spoke 1: Straight Down -->
    <line x1="60" y1="62" x2="60" y2="94"/>
    <!-- Spoke 2: Top Right -->
    <line x1="60" y1="62" x2="86" y2="43"/>
    <!-- Spoke 3: Top Left -->
    <line x1="60" y1="62" x2="34" y2="43"/>
    <!-- Spoke 4: Bottom Right -->
    <line x1="60" y1="62" x2="90" y2="72"/>
    <!-- Spoke 5: Bottom Left -->
    <line x1="60" y1="62" x2="30" y2="72"/>
  </g>

  <!-- Central White Circle with Blue Border -->
  <circle cx="60" cy="62" r="12" fill="#FFFFFF" stroke="#0072CE" stroke-width="2"/>

  <!-- Center 5-Pointed Blue Star -->
  <polygon points="
    60.0, 54.0
    62.5, 59.2
    68.2, 59.5
    63.8, 63.3
    65.2, 68.8
    60.0, 65.7
    54.8, 68.8
    56.2, 63.3
    51.8, 59.5
    57.5, 59.2" 
    fill="#0072CE"/>
</svg>
