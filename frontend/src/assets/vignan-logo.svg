<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 140" width="540" height="140" fill="none">
  <!-- Crest Shield (Left) -->
  <g transform="translate(10, 12)">
    <!-- Outer Shield Outline with concave top curve -->
    <path d="M12 20 C35 27 75 27 98 20 C100 48 90 85 55 108 C20 85 10 48 12 20 Z" 
          fill="#FFFFFF" 
          stroke="#7A70D6" 
          stroke-width="3" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Inner Lavender / Soft Blue Circular Disc -->
    <circle cx="55" cy="57" r="32" fill="#B4B0ED"/>

    <!-- 5 Radiating Blue Spokes aligned with star points -->
    <g stroke="#0072CE" stroke-width="7" stroke-linecap="butt">
      <!-- Straight Down (6 o'clock) -->
      <line x1="55" y1="57" x2="55" y2="89"/>
      <!-- Top Right -->
      <line x1="55" y1="57" x2="81" y2="38"/>
      <!-- Top Left -->
      <line x1="55" y1="57" x2="29" y2="38"/>
      <!-- Bottom Right -->
      <line x1="55" y1="57" x2="84" y2="67"/>
      <!-- Bottom Left -->
      <line x1="55" y1="57" x2="26" y2="67"/>
    </g>

    <!-- Central White Circle with Blue Ring -->
    <circle cx="55" cy="57" r="12" fill="#FFFFFF" stroke="#0072CE" stroke-width="2"/>

    <!-- Center 5-Pointed Blue Star -->
    <polygon points="
      55.0, 48.0
      57.7, 54.0
      64.2, 54.2
      59.3, 58.5
      60.8, 64.8
      55.0, 61.2
      49.2, 64.8
      50.7, 58.5
      45.8, 54.2
      52.3, 54.0" 
      fill="#0072CE"/>
  </g>

  <!-- Typography Lockup (Right of Shield) -->
  <g transform="translate(126, 14)">
    <!-- Primary Red Wordmark: VIGNAN'S -->
    <text x="0" y="50" 
          font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" 
          font-size="54" 
          font-weight="900" 
          fill="#E10600" 
          letter-spacing="0.01em">
      VIGNAN'S
    </text>

    <!-- Subtitle Line: FOUNDATION FOR SCIENCE, TECHNOLOGY & RESEARCH -->
    <text x="2" y="73" 
          font-family="'Arial', 'Helvetica Neue', sans-serif" 
          font-size="13" 
          font-weight="800" 
          fill="#111827" 
          letter-spacing="0.055em">
      FOUNDATION FOR SCIENCE, TECHNOLOGY &amp; RESEARCH
    </text>

    <!-- Blue Solid Pill Banner -->
    <rect x="0" y="83" width="400" height="26" rx="4" fill="#0072CE"/>

    <!-- Pill Subtext: (Deemed to be University) - Estd. u/s 3 of UGC Act 1956 -->
    <text x="200" y="100.5" 
          font-family="'Arial', 'Helvetica Neue', sans-serif" 
          font-size="11.5" 
          font-weight="700" 
          fill="#FFFFFF" 
          text-anchor="middle" 
          letter-spacing="0.02em">
      (Deemed to be University) - Estd. u/s 3 of UGC Act 1956
    </text>
  </g>
</svg>
